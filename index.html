<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🔒 SafeCall — защищённое общение</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #27272a;
    --line: #27272a;
    --txt: #f4f4f5;
    --muted: #71717a;
    --accent: #5865F2; /* Discord-like синий */
    --accent-hover: #4752C4;
    --danger: #ef4444;
    --msg-me: #5865F2; /* Синий как в Discord */
    --msg-them: #27272a;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { 
    min-height:100vh; 
    background:var(--bg); 
    color:var(--txt); 
    display:flex;  
    align-items:center; 
    justify-content:center; 
    padding:12px; 
    overflow-x:hidden; 
  }
  
  .app { 
    position:relative; 
    z-index:1; 
    width:100%; 
    max-width:1100px; /* Увеличил ширину */
    max-height:95vh;
    background:var(--surface); 
    border:1px solid var(--line); 
    border-radius:24px; 
    box-shadow:0 30px 80px rgba(0,0,0,.6); 
    overflow:hidden;
    display:flex;
  }
  
  /* ЛЕВАЯ ПАНЕЛЬ (как в Discord) */
  .sidebar {
    width:280px;
    background:#111;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:16px;
    flex-shrink:0;
  }
  
  .sidebar-header {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  
  .sidebar .logo { 
    width:40px; 
    height:40px; 
    border-radius:12px; 
    background:var(--accent);  
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:20px; 
    color:#fff;
    font-weight:700;
  }
  
  .sidebar-title {
    font-size:18px;
    font-weight:700;
    color:var(--txt);
  }
  
  .friends-section {
    flex:1;
    overflow-y:auto;
  }
  
  .section-title {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--muted);
    margin-bottom:12px;
    font-weight:600;
    padding:0 8px;
  }
  
  .add-friend-box {
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  
  .add-friend-box input {
    flex:1;
    padding:8px 12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--txt);
    font-size:13px;
  }
  
  .add-friend-box button {
    width:36px;
    height:36px;
    border-radius:8px;
    background:var(--accent);
    border:none;
    color:#fff;
    cursor:pointer;
    font-size:18px;
  }
  
  .friend-item { 
    display:flex; 
    align-items:center; 
    gap:12px; 
    padding:10px; 
    background:var(--surface); 
    border-radius:10px; 
    margin-bottom:6px; 
    cursor:pointer; 
    transition:.2s;
    border:1px solid transparent;
  }
  .friend-item:hover { 
    border-color:var(--accent);
    background:var(--surface-2);
  }
  .friend-item.active {
    border-color:var(--accent);
    background:rgba(88,101,242,0.15);
  }
  .friend-avatar { 
    width:40px; 
    height:40px; 
    border-radius:10px; 
    background:var(--accent); 
    color:#fff;
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:16px; 
    font-weight:700; 
    flex-shrink:0; 
  }
  .friend-info { flex:1; min-width:0; }
  .friend-name { 
    font-weight:600; 
    font-size:14px; 
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--txt);
  }
  .friend-status { 
    font-size:11px; 
    color:var(--muted); 
    margin-top:2px;
  }
  .friend-status.online { color:#10b981; }
  .del-friend { 
    width:28px;
    height:28px;
    background:rgba(239,68,68,0.1); 
    color:var(--danger); 
    border-radius:6px; 
    font-size:14px; 
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .del-friend:hover { background:rgba(239,68,68,0.2); }
  
  .sidebar-bottom { 
    margin-top:auto; 
    padding-top:16px;
    border-top:1px solid var(--line);
    display:flex; 
    flex-direction:column; 
    gap:8px; 
  }
  
  .sidebar-btn {
    padding:10px 12px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    transition:0.2s;
  }
  .sidebar-btn:hover { 
    background:var(--surface); 
    color:var(--txt);
    border-color:var(--accent);
  }
  .sidebar-btn.danger {
    color:var(--danger);
    border-color:rgba(239,68,68,0.3);
  }
  .sidebar-btn.danger:hover {
    background:rgba(239,68,68,0.1);
  }
  
  /* ПРАВАЯ ПАНЕЛЬ (ЧАТ) */
  .main-wrapper {
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  
  .header { 
    padding:16px 24px; 
    display:flex; 
    align-items:center; 
    gap:12px; 
    border-bottom:1px solid var(--line); 
    background:var(--surface);
    flex-shrink:0;
  }
  .header h1 { 
    font-size:18px; 
    font-weight:700; 
    color:var(--txt);
  }
  .ver-badge { 
    font-size:10px; 
    color:var(--muted); 
    background:var(--surface-2);
    padding:2px 8px; 
    border-radius:999px; 
  }
  .user-info { 
    margin-left:auto; 
    font-size:12px; 
    padding:6px 12px; 
    border-radius:8px; 
    background:var(--surface-2); 
    display:flex; 
    align-items:center; 
    gap:8px; 
  }
  
  .content { 
    padding:0; 
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  
  /* ЭКРАН АВТОРИЗАЦИИ */
  #authScreen {
    padding:40px;
    max-width:400px;
    margin:0 auto;
    width:100%;
  }
  
  .auth-tabs { 
    display:flex; 
    gap:8px; 
    margin-bottom:24px; 
    background:var(--bg); 
    padding:4px; 
    border-radius:12px; 
  }
  .auth-tab { 
    flex:1; 
    padding:10px; 
    background:transparent; 
    border-radius:8px; 
    cursor:pointer; 
    text-align:center; 
    font-size:14px; 
    color:var(--muted); 
  }
  .auth-tab.active { 
    background:var(--surface-2); 
    color:var(--txt); 
    font-weight:600;
  }
  
  .section { margin-bottom:20px; }
  input[type=text], input[type=password] { 
    width:100%; 
    padding:12px 16px; 
    background:var(--bg); 
    border:1px solid var(--line); 
    border-radius:10px; 
    color:var(--txt); 
    font-size:14px; 
    margin-bottom:12px;
  }
  input::placeholder { color:var(--muted); }
  
  button.action-btn { 
    padding:12px 18px; 
    border:none; 
    border-radius:10px; 
    font-size:14px; 
    font-weight:600; 
    cursor:pointer; 
    width:100%;
  }
  .btn-primary { 
    background:var(--accent); 
    color:#fff;
  }
  
  /* ЭКРАН ЗВОНКА */
  #callScreen {
    padding:24px;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  
  .call-ui { 
    text-align:center; 
    padding:12px 0;
    flex-shrink:0;
  }
  .avatar-container { 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    gap:32px; 
    margin-bottom:16px; 
  }
  .avatar-wrap { position:relative; }
  .avatar { 
    width:90px; 
    height:90px; 
    border-radius:50%; 
    background:var(--accent); 
    color:#fff;
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:36px; 
  }
  .avatar-wrap.speaking::before { 
    content:''; 
    position:absolute; 
    inset:-5px; 
    border-radius:50%; 
    border:3px solid var(--accent);
    animation:ringPulse 1.2s ease-out infinite; 
  }
  @keyframes ringPulse { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.35);opacity:0} }
  .avatar-label { margin-top:8px; font-size:13px; color:var(--muted); }
  
  #callStatus { 
    font-size:12px; 
    color:var(--accent);
    margin-bottom:16px;
    min-height:18px;
  }
  
  .controls { 
    display:flex; 
    gap:12px; 
    justify-content:center; 
    margin-bottom:16px;
  }
  .ctrl-btn { 
    width:48px; 
    height:48px; 
    border-radius:50%; 
    background:var(--surface-2); 
    border:none;
    color:var(--txt);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ctrl-btn.active { background:var(--accent); color:#fff; }
  .ctrl-btn.off { background:var(--danger); color:#fff; }
  .ctrl-btn svg { width:22px; height:22px; }
  
  /* ОКНО ЧАТА (Discord-like) */
  .chat-window {
    flex:1;
    background:#0a0a0f;
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    min-height:300px;
  }
  
  .chat-messages {
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  
  .msg { 
    padding:12px 16px; 
    border-radius:12px; 
    max-width:75%; 
    font-size:14px; 
    line-height:1.5;
    animation:fadeIn .25s ease;
    position: relative;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  
  .msg.me { 
    background:var(--msg-me); /* Синий Discord */
    color:#fff;
    margin-left:auto; 
    border-bottom-right-radius:4px;
    box-shadow:0 4px 15px rgba(88,101,242,0.3);
  }
  
  .msg.them { 
    background:var(--msg-them); 
    color:var(--txt);
    border-bottom-left-radius:4px;
  }
  
  .msg.sys { 
    background:transparent; 
    color:var(--muted); 
    font-size:12px; 
    text-align:center; 
    max-width:100%; 
    border:1px dashed var(--line);
    padding:8px;
  }
  
  .msg audio {
    width:100%;
    margin-top:8px;
  }
  
  .msg-time {
    font-size:10px;
    opacity:0.7;
    margin-top:4px;
  }
  
  .chat-input-area {
    padding:16px;
    background:var(--surface);
    border-top:1px solid var(--line);
  }
  
  .chat-input { 
    display:flex; 
    gap:10px; 
    align-items:center;
  }
  .chat-input input { 
    flex:1; 
    padding:12px 16px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--txt);
    font-size:14px;
  }
  .chat-input button { 
    width:44px;
    height:44px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
  }
  .btn-voice {
    background:var(--surface-2);
    color:var(--txt);
    border:1px solid var(--line);
  }
  .btn-voice.recording {
    background:var(--danger);
    color:#fff;
    animation:pulse 1s infinite;
  }
  .btn-send {
    background:var(--accent);
    color:#fff;
  }
  
  @keyframes pulse { 
    0%,100% { transform:scale(1); } 
    50% { transform:scale(1.1); } 
  }
  
  /* НАСТРОЙКИ */
  #settingsOverlay { 
    position:fixed; 
    inset:0; 
    background:rgba(0,0,0,0.9); 
    backdrop-filter:blur(8px); 
    z-index:1000; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    padding:20px; 
  }
  .settings-panel { 
    width:100%;
    max-width:600px;
    max-height:90vh; 
    overflow-y:auto; 
    background:var(--surface); 
    border:1px solid var(--line); 
    border-radius:20px; 
    padding:32px;
  }
  .settings-head { 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
    margin-bottom:24px; 
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .settings-head h2 { font-size:20px; font-weight:700; }
  
  .set-group { 
    margin-bottom:24px; 
    padding:20px; 
    background:var(--bg); 
    border:1px solid var(--line); 
    border-radius:12px; 
  }
  .set-title { 
    font-size:12px; 
    text-transform:uppercase; 
    letter-spacing:1.2px; 
    color:var(--accent); 
    margin-bottom:16px; 
    font-weight:700; 
  }
  
  .switch-row { 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    padding:12px 0; 
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .switch-row:last-child { border-bottom:none; }
  .switch-row span { font-size:14px; }
  
  .switch-row:has(input:checked) span { color:var(--accent); }
  .switch-row:not(:has(input:checked)) span { color:var(--danger); }
  
  .switch-circle {
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--surface-2);
    border:2px solid var(--danger);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
    color:var(--danger);
  }
  .switch-row:has(input:checked) .switch-circle {
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  
  select { 
    width:100%; 
    padding:10px; 
    background:var(--surface); 
    border:1px solid var(--line); 
    border-radius:8px; 
    color:var(--txt); 
    margin-bottom:10px;
  }
  input[type=range] { width:100%; accent-color:var(--accent); }
  
  .hidden { display:none !important; }
  ::-webkit-scrollbar { width:8px; } 
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  
  @media (max-width: 900px) {
    .app { flex-direction:column; max-width:100%; }
    .sidebar { width:100%; height:auto; max-height:40vh; }
    .sidebar-bottom { flex-direction:row; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">S</div>
      <div class="sidebar-title">SafeCall</div>
    </div>
    
    <div class="friends-section">
      <div class="section-title">Друзья</div>
      <div class="add-friend-box">
        <input type="text" id="addFriendInput" placeholder="Username друга" />
        <button id="addFriendBtn">+</button>
      </div>
      <div id="friendsList"></div>
    </div>
    
    <div class="sidebar-bottom">
      <button class="sidebar-btn" id="settingsBtn">
        <span>⚙️</span> Настройки
      </button>
      <button class="sidebar-btn danger" id="logoutBtn">
        <span>✕</span> Выйти
      </button>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <div class="main-wrapper">
    <div class="header">
      <h1>SafeCall</h1>
      <span class="ver-badge">v14</span>
      <div class="user-info hidden" id="userInfo">
        <span>👤 <span id="currentUsername"></span></span>
      </div>
    </div>

    <div class="content">
      <!-- ЭКРАН АВТОРИЗАЦИИ -->
      <div id="authScreen">
        <div class="auth-tabs">
          <div class="auth-tab active" data-tab="login">Вход</div>
          <div class="auth-tab" data-tab="register">Регистрация</div>
        </div>
        <div id="loginForm">
          <div class="section">
            <input type="text" id="loginUsername" placeholder="Username" />
            <input type="password" id="loginPassword" placeholder="Пароль" />
            <button class="action-btn btn-primary" id="loginBtn">Войти</button>
          </div>
        </div>
        <div id="registerForm" class="hidden">
          <div class="section">
            <input type="text" id="regUsername" placeholder="Придумай username" />
            <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" />
            <input type="password" id="regPassword2" placeholder="Повтори пароль" />
            <button class="action-btn btn-primary" id="registerBtn">Создать аккаунт</button>
          </div>
        </div>
      </div>

      <!-- ЭКРАН ЗВОНКА -->
      <div id="callScreen" class="hidden">
        <div class="call-ui">
          <div class="avatar-container">
            <div>
              <div class="avatar-wrap">
                <div class="avatar">🎤</div>
              </div>
              <div class="avatar-label">Ты</div>
            </div>
            <div>
              <div class="avatar-wrap" id="remoteWrap">
                <div class="avatar"></div>
              </div>
              <div class="avatar-label" id="remoteName">Друг</div>
            </div>
          </div>
          <div id="callStatus">⏳ Подключение...</div>
          <div class="controls">
            <button class="ctrl-btn active" id="micBtn" title="Микрофон">🎤</button>
            <button class="ctrl-btn active" id="speakerBtn" title="Динамик">🔊</button>
            <button class="ctrl-btn" id="hangupBtn" title="Завершить"></button>
          </div>
        </div>
        
        <!-- ОКНО ЧАТА -->
        <div class="chat-window">
          <div class="chat-messages" id="chatBox"></div>
          <div class="chat-input-area">
            <div class="chat-input">
              <button class="btn-voice" id="recordVoiceBtn" title="Запись голосового">🎤</button>
              <input type="text" id="chatInput" placeholder="Написать сообщение..." />
              <button class="btn-send" id="sendMsg"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- НАСТРОЙКИ -->
<div id="settingsOverlay" class="hidden">
  <div class="settings-panel">
    <div class="settings-head">
      <h2>️ Настройки</h2>
      <button class="icon-btn" id="closeSettings" style="background:none;border:none;color:var(--txt);cursor:pointer;font-size:24px">✕</button>
    </div>

    <div class="set-group">
      <div class="set-title">🎙️ Устройства</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Микрофон</label>
      <select id="setMic"></select>
      <label style="font-size:12px;color:var(--muted);display:block;margin:10px 0 6px">Динамики</label>
      <select id="setOut"></select>
      <label style="font-size:12px;color:var(--muted);display:block;margin:10px 0 6px">Громкость: <span id="volVal">100</span>%</label>
      <input type="range" id="setVolume" min="0" max="100" value="100">
    </div>

    <div class="set-group">
      <div class="set-title">🔇 Обработка звука</div>
      <label class="switch-row">
        <span>Шумоподавление</span>
        <input type="checkbox" id="setNoise" checked>
        <div class="switch-circle">✓</div>
      </label>
      <label class="switch-row">
        <span>Эхоподавление</span>
        <input type="checkbox" id="setEcho" checked>
        <div class="switch-circle">✓</div>
      </label>
    </div>

    <div class="set-group">
      <div class="set-title">🔔 Уведомления</div>
      <label class="switch-row">
        <span>Звук сообщений</span>
        <input type="checkbox" id="setMsgSound" checked>
        <div class="switch-circle">✓</div>
      </label>
    </div>
  </div>
</div>

<script>
// ===== FIREBASE CONFIG =====
firebase.initializeApp({
  apiKey: "AIzaSyAQx0frI6wgyTjPrHyDqBlJquG90mxWti4",
  authDomain: "safecall-d62d9.firebaseapp.com",
  projectId: "safecall-d62d9",
  storageBucket: "safecall-d62d9.firebasestorage.app",
  messagingSenderId: "337440054005",
  appId: "1:337440054005:web:d4488b3e90bcf5fa1f83bc"
});
const db = firebase.firestore();

// ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
let currentUser = null, userData = null;
let pc = null, localStream = null, remoteAudio = null;
let currentCall = null, callRole = null;
let chatId = null, chatKey = null;
let seenMsgs = new Set();
let speakerOn = true;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let recordingInterval = null;

// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };

async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: enc.encode(salt), iterations:100000, hash:'SHA-256' }, km, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function encryptMsg(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
  const buf = new Uint8Array(12 + ct.byteLength);
  buf.set(iv, 0); buf.set(new Uint8Array(ct), 12);
  return b64(buf);
}

async function decryptMsg(key, data) {
  const buf = unb64(data);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: buf.slice(0,12) }, key, buf.slice(12));
  return new TextDecoder().decode(pt);
}

// ===== КЛЮЧИ ШИФРОВАНИЯ =====
let myPriv = null, myPubB64 = null;
async function ensureMyKeyPair() {
  let privB64 = localStorage.getItem('sc_priv_' + currentUser);
  let pubB64 = localStorage.getItem('sc_pub_' + currentUser);
  if (!privB64 || !pubB64) {
    const pair = await crypto.subtle.generateKey({ name:'ECDH', namedCurve:'P-256' }, true, ['deriveKey']);
    privB64 = b64(await crypto.subtle.exportKey('pkcs8', pair.privateKey));
    pubB64 = b64(await crypto.subtle.exportKey('raw', pair.publicKey));
    localStorage.setItem('sc_priv_' + currentUser, privB64);
    localStorage.setItem('sc_pub_' + currentUser, pubB64);
  }
  myPubB64 = pubB64;
  myPriv = await crypto.subtle.importKey('pkcs8', unb64(privB64), { name:'ECDH', namedCurve:'P-256' }, false, ['deriveKey']);
  await db.collection('users').doc(currentUser).update({ pubKey: pubB64 });
}

// ===== АВТОРИЗАЦИЯ =====
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
    document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  };
});

document.getElementById('registerBtn').onclick = async () => {
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  
  if (!username || !password) return alert('Заполни все поля!');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return alert('Username: 3-20 символов, только латиница/цифры/_');
  if (password.length < 6) return alert('Пароль минимум 6 символов!');
  if (password !== password2) return alert('Пароли не совпадают!');
  
  try {
    const ref = db.collection('users').doc(username);
    if ((await ref.get()).exists) return alert('Такой username уже занят!');
    
    const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
    const passHash = await hashPassword(password, salt);
    
    await ref.set({ username, salt, pass: passHash, friends: [], online: true, lastSeen: Date.now(), pubKey: null });
    alert('✅ Аккаунт создан! Теперь войди.');
    document.querySelector('.auth-tab[data-tab="login"]').click();
  } catch (e) { alert('Ошибка: ' + e.message); }
};

document.getElementById('loginBtn').onclick = async () => {
  const username = document.getElementById('loginUsername').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  
  try {
    const snap = await db.collection('users').doc(username).get();
    if (!snap.exists) return alert('Пользователь не найден!');
    
    const user = snap.data();
    const passwordHash = await hashPassword(password, user.salt);
    if (passwordHash !== user.pass) return alert('Неверный пароль!');
    
    currentUser = username; 
    userData = user;
    localStorage.setItem('safecall_current', username);
    
    await ensureMyKeyPair();
    await db.collection('users').doc(currentUser).update({ online: true, lastSeen: Date.now() });
    setInterval(() => db.collection('users').doc(currentUser).update({ online: true, lastSeen: Date.now() }), 30000);
    
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('userInfo').classList.remove('hidden');
    document.getElementById('currentUsername').textContent = currentUser;
    renderFriends();
  } catch (e) { alert('Ошибка входа: ' + e.message); }
};

document.getElementById('logoutBtn').onclick = async () => {
  if (currentUser) await db.collection('users').doc(currentUser).update({ online: false });
  localStorage.removeItem('safecall_current');
  location.reload();
};

// ===== СПИСОК ДРУЗЕЙ =====
async function renderFriends() {
  const list = document.getElementById('friendsList');
  list.innerHTML = '';
  
  userData = (await db.collection('users').doc(currentUser).get()).data();
  const friends = userData.friends || [];
  
  if (!friends.length) {
    list.innerHTML = '<p style="color:var(--muted);padding:20px;text-align:center">Нет друзей</p>';
    return;
  }
  
  for (const friend of friends) {
    const s = await db.collection('users').doc(friend).get();
    const fd = s.data();
    const online = fd.online && (Date.now() - fd.lastSeen < 90000);
    
    const div = document.createElement('div');
    div.className = 'friend-item';
    div.innerHTML = `
      <div class="friend-avatar">${friend[0].toUpperCase()}</div>
      <div class="friend-info">
        <div class="friend-name">${friend}</div>
        <div class="friend-status ${online?'online':''}">${online?'● Онлайн':'○ Не в сети'}</div>
      </div>
      <button class="del-friend" data-f="${friend}">✕</button>
    `;
    
    div.onclick = e => { if (!e.target.classList.contains('del-friend')) callFriend(friend); };
    div.querySelector('.del-friend').onclick = async e => {
      e.stopPropagation();
      if (!confirm('Удалить ' + friend + '?')) return;
      await db.collection('users').doc(currentUser).update({ friends: firebase.firestore.FieldValue.arrayRemove(friend) });
      await db.collection('users').doc(friend).update({ friends: firebase.firestore.FieldValue.arrayRemove(currentUser) });
      renderFriends();
    };
    
    list.appendChild(div);
  }
}

document.getElementById('addFriendBtn').onclick = async () => {
  const f = document.getElementById('addFriendInput').value.trim().toLowerCase();
  if (!f || f === currentUser) return alert('Введите корректный username!');
  
  const ref = await db.collection('users').doc(f).get();
  if (!ref.exists) return alert('Пользователь не найден!');
  if ((userData.friends || []).includes(f)) return alert('Уже в друзьях!');
  
  await db.collection('users').doc(currentUser).update({ friends: firebase.firestore.FieldValue.arrayUnion(f) });
  await db.collection('users').doc(f).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUser) });
  document.getElementById('addFriendInput').value = '';
  renderFriends();
};

// ===== ЗВОНОК (WebRTC) =====
const RTC_CONFIG = { 
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

async function callFriend(friend) {
  if (currentCall) return alert('Уже идёт звонок!');
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    return alert('Нет доступа к микрофону!');
  }
  
  currentCall = friend;
  callRole = 'caller';
  
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  
  pc.ontrack = e => {
    remoteAudio = new Audio();
    remoteAudio.srcObject = e.streams[0];
    remoteAudio.autoplay = true;
    document.body.appendChild(remoteAudio);
    document.getElementById('callStatus').textContent = '✅ Голос подключён';
    document.getElementById('callStatus').style.color = '#10b981';
  };
  
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'connected') {
      document.getElementById('callStatus').textContent = '✅ Соединение установлено';
    } else if (pc.iceConnectionState === 'failed') {
      hangup();
    }
  };
  
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  
  // Ждём ICE кандидатов
  await new Promise(r => setTimeout(r, 2000));
  
  await db.collection('calls').doc(friend).set({
    from: currentUser,
    offer: pc.localDescription.toJSON(),
    answer: null,
    endTs: 0,
    ts: Date.now()
  });
  
  // Слушим ответ
  db.collection('calls').doc(friend).onSnapshot(async snap => {
    const d = snap.data();
    if (!d) return;
    
    if (d.endTs) { hangup(); return; }
    
    if (d.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(d.answer);
    }
  });
  
  showCallScreen(friend);
}

document.querySelector('#acceptCall')?.remove(); // Удаляем старую кнопку если есть

// Создаём кнопку принятия звонка
const acceptBtn = document.createElement('button');
acceptBtn.id = 'acceptCall';
acceptBtn.className = 'ctrl-btn';
acceptBtn.style.cssText = 'background:#10b981;color:#fff;width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;font-size:20px';
acceptBtn.innerHTML = '✓';
acceptBtn.onclick = async () => {
  if (!pendingOffer) return;
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) { return alert('Нет доступа к микрофону!'); }
  
  currentCall = pendingOffer.from;
  callRole = 'callee';
  
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  
  pc.ontrack = e => {
    remoteAudio = new Audio();
    remoteAudio.srcObject = e.streams[0];
    remoteAudio.autoplay = true;
    document.body.appendChild(remoteAudio);
    document.getElementById('callStatus').textContent = '✅ Голос подключён';
  };
  
  await pc.setRemoteDescription(pendingOffer.offer);
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await new Promise(r => setTimeout(r, 2000));
  
  await db.collection('calls').doc(currentUser).update({
    answer: pc.localDescription.toJSON()
  });
  
  showCallScreen(pendingOffer.from);
  document.getElementById('incomingOverlay').classList.add('hidden');
};

// Слушим входящие звонки
let pendingOffer = null;
db.collection('calls').doc(currentUser).onSnapshot(snap => {
  const d = snap.data();
  if (!d) return;
  
  if (d.offer && !d.answer && d.from !== currentUser) {
    pendingOffer = d;
    if (!document.getElementById('incomingOverlay')) {
      const overlay = document.createElement('div');
      overlay.id = 'incomingOverlay';
      overlay.className = 'hidden';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);z-index:999;display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <div style="text-align:center;padding:40px;background:var(--surface);border-radius:20px;max-width:90%;">
          <div style="font-size:48px;margin-bottom:16px">📞</div>
          <div style="font-size:20px;font-weight:700;margin-bottom:24px">Входящий от ${d.from}</div>
          <div style="display:flex;gap:16px;justify-content:center;">
            ${acceptBtn.outerHTML}
            <button id="declineCall" style="background:var(--danger);color:#fff;width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;font-size:20px">✕</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }
    document.getElementById('incomingOverlay').classList.remove('hidden');
    
    document.getElementById('declineCall').onclick = () => {
      db.collection('calls').doc(currentUser).update({ endTs: Date.now() });
      document.getElementById('incomingOverlay').classList.add('hidden');
      pendingOffer = null;
    };
  }
  
  if (d.endTs && currentCall) hangup();
});

function showCallScreen(friend) {
  document.getElementById('callScreen').classList.remove('hidden');
  document.getElementById('remoteName').textContent = friend;
  document.getElementById('chatBox').innerHTML = '';
  initChat(friend);
}

function hangup() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (remoteAudio) { remoteAudio.remove(); remoteAudio = null; }
  
  if (currentCall) {
    const docId = callRole === 'caller' ? currentCall : currentUser;
    db.collection('calls').doc(docId).update({ endTs: Date.now() });
  }
  
  currentCall = null;
  document.getElementById('callScreen').classList.add('hidden');
  stopChat();
}

document.getElementById('hangupBtn').onclick = () => hangup();

document.getElementById('micBtn').onclick = function() {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  this.classList.toggle('off', !t.enabled);
  this.classList.toggle('active', t.enabled);
};

document.getElementById('speakerBtn').onclick = function() {
  speakerOn = !speakerOn;
  if (remoteAudio) remoteAudio.muted = !speakerOn;
  this.classList.toggle('active', speakerOn);
  this.classList.toggle('off', !speakerOn);
};

// ===== ЧАТ =====
function initChat(friend) {
  chatId = [currentUser, friend].sort().join('_');
  chatKey = null;
  seenMsgs = new Set();
  
  // Получаем ключ друга
  db.collection('users').doc(friend).get().then(async snap => {
    const pubKey = snap.data()?.pubKey;
    if (pubKey && myPriv) {
      const other = await crypto.subtle.importKey('raw', unb64(pubKey), { name:'ECDH', namedCurve:'P-256' }, false, []);
      chatKey = await crypto.subtle.deriveKey({ name:'ECDH', public: other }, myPriv, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
      addMsg('🔒 Чат зашифрован', 'sys');
    }
  });
  
  // Слушим сообщения
  db.collection('messages').where('chat', '==', chatId).orderBy('ts', 'asc').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') {
        const el = document.querySelector(`.msg[data-id="${ch.doc.id}"]`);
        if (el) el.remove();
        return;
      }
      
      const id = ch.doc.id;
      if (seenMsgs.has(id)) return;
      seenMsgs.add(id);
      
      const m = ch.doc.data();
      if (!m || m.from === currentUser) return;
      
      if (m.isVoice) {
        addMsg(m.data, 'them', id, true);
      } else if (chatKey) {
        decryptMsg(chatKey, m.data).then(t => addMsg(t, 'them', id));
      }
    });
  });
}

function stopChat() {
  chatId = null;
  chatKey = null;
  seenMsgs.clear();
}

function addMsg(content, type, msgId = null, isVoice = false) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (msgId) div.setAttribute('data-id', msgId);
  
  if (isVoice) {
    div.innerHTML = `<audio controls src="${content}" style="width:100%;margin-top:8px"></audio><div class="msg-time">${new Date().toLocaleTimeString()}</div>`;
  } else {
    div.innerHTML = `<div>${content}</div><div class="msg-time">${new Date().toLocaleTimeString()}</div>`;
  }
  
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ОТПРАВКА СООБЩЕНИЙ
document.getElementById('sendMsg').onclick = async () => {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !chatKey || !chatId) return;
  
  const data = await encryptMsg(chatKey, text);
  await db.collection('messages').add({ chat: chatId, from: currentUser, data, ts: Date.now() });
  addMsg(text, 'me');
  input.value = '';
};

document.getElementById('chatInput').addEventListener('keypress', e => { 
  if (e.key === 'Enter') document.getElementById('sendMsg').click(); 
});

// ГОЛОСОВЫЕ СООБЩЕНИЯ (ПО КЛИКУ, не удержание)
document.getElementById('recordVoiceBtn').onclick = async () => {
  if (!chatId) return alert('Нет активного чата!');
  
  if (!isRecording) {
    // НАЧАТЬ ЗАПИСЬ
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
          const base64data = reader.result;
          addMsg(base64data, 'me', null, true);
          
          await db.collection('messages').add({
            chat: chatId,
            from: currentUser,
            data: base64data,
            isVoice: true,
            ts: Date.now()
          });
          
          stream.getTracks().forEach(t => t.stop());
        };
      };
      
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordVoiceBtn').classList.add('recording');
      document.getElementById('recordVoiceBtn').textContent = '';
    } catch(e) {
      alert('Нет доступа к микрофону!');
    }
  } else {
    // ОСТАНОВИТЬ ЗАПИСЬ
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('recordVoiceBtn').classList.remove('recording');
      document.getElementById('recordVoiceBtn').textContent = '🎤';
    }
  }
};

// НАСТРОЙКИ
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('settingsOverlay').classList.remove('hidden');
  
  // Загружаем устройства
  navigator.mediaDevices.enumerateDevices().then(devs => {
    const micSel = document.getElementById('setMic');
    const outSel = document.getElementById('setOut');
    micSel.innerHTML = '<option value="default">По умолчанию</option>';
    outSel.innerHTML = '<option value="default">По умолчанию</option>';
    
    let mi = 1, oi = 1;
    devs.forEach(d => {
      if (d.kind === 'audioinput') micSel.innerHTML += `<option value="${d.deviceId}">${d.label || 'Микрофон ' + mi++}</option>`;
      if (d.kind === 'audiooutput') outSel.innerHTML += `<option value="${d.deviceId}">${d.label || 'Динамики ' + oi++}</option>`;
    });
  });
};

document.getElementById('closeSettings').onclick = () => {
  document.getElementById('settingsOverlay').classList.add('hidden');
};

window.onload = async () => {
  const saved = localStorage.getItem('safecall_current');
  if (!saved) return;
  
  const snap = await db.collection('users').doc(saved).get();
  if (!snap.exists) {
    localStorage.removeItem('safecall_current');
    return;
  }
  
  currentUser = saved;
  userData = snap.data();
  await ensureMyKeyPair();
  await db.collection('users').doc(currentUser).update({ online: true, lastSeen: Date.now() });
  setInterval(() => db.collection('users').doc(currentUser).update({ online: true, lastSeen: Date.now() }), 30000);
  
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('userInfo').classList.remove('hidden');
  document.getElementById('currentUsername').textContent = currentUser;
  renderFriends();
};

window.onbeforeunload = () => {
  if (currentUser) db.collection('users').doc(currentUser).update({ online: false });
};
