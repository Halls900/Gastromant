<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мессенджер</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1b26; color: #e2e2e2;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #24283b; display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 18px; }
  #myId { font-size: 13px; color: #7aa2f7; cursor: pointer; }
  .panel { margin: auto; text-align: center; }
  .panel input { display: block; margin: 8px auto; padding: 10px; border-radius: 8px;
                 border: 1px solid #3d4a6b; background: #24283b; color: #fff; font-size: 15px; width: 260px; }
  button, .btn { padding: 10px 18px; border: none; border-radius: 8px; margin: 4px;
        background: #7aa2f7; color: #1a1b26; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn:disabled { opacity: .4; }
  .err { color: #f7768e; min-height: 20px; font-size: 13px; margin-top: 8px; }
  #app { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #connectBar { display: flex; flex-wrap: wrap; padding: 8px 12px; background: #24283b; gap: 8px; align-items: center; }
  #connectBar input { padding: 8px; border-radius: 6px; border: 1px solid #3d4a6b; background: #1a1b26; color: #fff; }
  #peerInput { flex: 2; min-width: 140px; }
  #encKey { flex: 1; min-width: 120px; border-color: #73daca !important; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; margin: 4px 0; background: #343a55; }
  .out { background: #2f6f6f; margin-left: auto; }
  .meta { font-size: 11px; opacity: .6; background: none; text-align: center; max-width: none; padding: 2px; }
  #inputBar { display: flex; padding: 8px; gap: 8px; background: #24283b; }
  #msgInput { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #3d4a6b; background: #1a1b26; color: #fff; }
  #videos { display: none; gap: 8px; padding: 8px; }
  video { width: 200px; border-radius: 8px; background: #000; }
  #controls { display: none; padding: 8px; gap: 8px; justify-content: center; background: #24283b; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
<div id="auth" class="panel">
  <h1 style="margin-bottom:16px">💬 Мессенджер</h1>
  <input id="regNick"  placeholder="Ник (виден собеседнику)" style="display:none">
  <input id="regEmail" placeholder="E-mail">
  <input id="regPass"  placeholder="Пароль (минимум 6 символов)" type="password">
  <div id="authForm">
    <button id="loginBtn">Войти</button>
    <button id="regBtn" style="background:#73daca; display:none">Создать аккаунт</button>
  </div>
  <a href="#" id="toggleAuth" style="color:#7aa2f7; font-size:13px">Нет аккаунта? Зарегистрироваться</a>
  <div class="err" id="authErr"></div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app">
  <header>
    <h1>💬 Мессенджер</h1>
    <span id="myId" title="Нажмите, чтобы скопировать"></span>
    <span style="margin-left:auto; font-size:13px; cursor:pointer; color:#f7768e" id="logout">Выйти</span>
  </header>

  <div id="connectBar">
    <input id="peerInput" placeholder="Ник собеседника">
    <input id="encKey" type="password" placeholder="🔐 Общий ключ шифрования">
    <button class="btn" id="connectBtn">Подключиться</button>
    <button class="btn" id="callBtn" disabled>📞 Позвонить</button>
    <button class="btn" id="hangBtn" style="display:none">🔴 Сбросить</button>
  </div>

  <div id="chat"></div>

  <div id="videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="controls">
    <button class="btn" id="muteBtn">🔇 Микрофон</button>
    <button class="btn" id="camBtn">📷 Камера</button>
  </div>

  <div id="inputBar">
    <input id="msgInput" placeholder="Сообщение...">
    <button class="btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
// ==== КОНФИГ SUPABASE ====
const SUPABASE_URL = "https://pwqqppyenyhdcifexjnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_wNMT0l65AYITob1IT8ax1w_6wxsXDSu"; 
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let regMode = false;

$('toggleAuth').onclick = e => {
  e.preventDefault();
  regMode = !regMode;
  $('regNick').style.display = regMode ? 'block' : 'none';
  $('regBtn').style.display  = regMode ? 'inline-block' : 'none';
  $('loginBtn').style.display = regMode ? 'none' : 'inline-block';
  $('toggleAuth').textContent = regMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
  $('authErr').textContent = '';
};

$('regBtn').onclick = async () => {
  const nick = $('regNick').value.trim(), email = $('regEmail').value.trim(), pass = $('regPass').value;
  $('authErr').textContent = '';
  if (!nick || nick.length < 3) return $('authErr').textContent = 'Ник минимум 3 символа';
  if (pass.length < 6)          return $('authErr').textContent = 'Пароль минимум 6 символов';
  try {
    const { data: taken } = await db.from('profiles').select('nickname').eq('nickname', nick).maybeSingle();
    if (taken) return $('authErr').textContent = 'Этот ник уже занят';

    const { error: signErr } = await db.auth.signUp({ email, password: pass });
    if (signErr) throw signErr;

    const { error: insErr } = await db.from('profiles')
      .insert({ nickname: nick, uid: (await db.auth.getUser()).data.user.id });
    if (insErr) {
      if (insErr.code === '23505') return $('authErr').textContent = 'Этот ник уже занят';
      throw insErr;
    }
    localStorage.setItem('nick', nick);
    startApp(nick);
  } catch (err) {
    $('authErr').textContent =
      err.code === 'user_already_exists' ? 'Такой e-mail уже зарегистрирован' :
      err.code === 'validation_failed'   ? 'Проверьте e-mail и пароль (минимум 6 символов)' :
      err.message || 'Ошибка регистрации';
  }
};

$('loginBtn').onclick = async () => {
  const email = $('regEmail').value.trim(), pass = $('regPass').value;
  $('authErr').textContent = '';
  try {
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    const uid = (await db.auth.getUser()).data.user.id;
    const { data, error: pErr } = await db.from('profiles').select('nickname').eq('uid', uid).maybeSingle();
    if (pErr || !data) throw new Error('Профиль не найден');
    localStorage.setItem('nick', data.nickname);
    startApp(data.nickname);
  } catch (err) {
    $('authErr').textContent = err.message.includes('Invalid login')
      ? 'Неверный e-mail или пароль' : 'Ошибка: ' + (err.message || err.code);
  }
};

db.auth.getSession().then(async ({ data }) => {
  if (!data.session || localStorage.getItem('nick')) {
    if (data.session && localStorage.getItem('nick')) startApp(localStorage.getItem('nick'));
    return;
  }
  const uid = data.session.user.id;
  const { data: p } = await db.from('profiles').select('nickname').eq('uid', uid).maybeSingle();
  if (p) { localStorage.setItem('nick', p.nickname); startApp(p.nickname); }
});

$('logout').onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

// ==== ШИФРОВАНИЕ ПЕРЕПИСКИ (AES-GCM поверх канала) ====
const enc = new TextEncoder(), dec = new TextDecoder();
let aesKey = null;

async function deriveKey(secret) {
  const raw = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('messenger-e2ee-v1'), iterations: 150000, hash: 'SHA-256' },
    raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

async function encryptMsg(text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(text));
  return { iv: b64(iv), data: b64(data) };
}
async function decryptMsg(packet) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: unb64(packet.iv) }, aesKey, unb64(packet.data));
  return dec.decode(plain);
}

// ==== МЕССЕНДЖЕР ====
let peer, myStream, activeCall, conn, myName;

function startApp(nick) {
  myName = nick;
  $('auth').style.display = 'none';
  $('app').style.display = 'flex';
  peer = new Peer(nick);
  peer.on('open', id => $('myId').textContent = 'Мой ник: ' + id);
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') addMsg('Пользователь не в сети', 'meta');
    else alert('Ошибка сети: ' + e.type);
  });
  peer.on('connection', c => bindConn(c));
  peer.on('call', async call => {
    await getStream();
    activeCall = call; call.answer(myStream); bindCall(call);
  });
}

function bindConn(c) {
  conn = c;
  conn.on('open', () => { $('connectBtn').disabled = true; addMsg('Собеседник подключён ✅', 'meta'); });
  conn.on('data', async d => {
    if (d.type !== 'msg') return;
    if (d.encrypted) {
      if (!aesKey) return addMsg('🔐 Зашифрованное сообщение — введите общий ключ шифрования', 'meta');
      try { addMsg(await decryptMsg(d), 'in'); }
      catch { addMsg('🔐 [не удалось расшифровать — ключ не совпадает]', 'meta'); }
    } else {
      addMsg(d.text, 'in');
    }
  });
  conn.on('close', () => { addMsg('Собеседник отключён', 'meta'); $('connectBtn').disabled = false; });
}

function bindCall(call) {
  call.on('stream', remote => {
    $('remoteVideo').srcObject = remote;
    $('videos').style.display = 'flex'; $('controls').style.display = 'flex';
    $('chat').style.display = 'none'; $('inputBar').style.display = 'none';
    $('hangBtn').style.display = 'inline-block'; $('callBtn').disabled = true;
  });
  call.on('close', endCall);
  call.on('error', endCall);
}

async function getStream() {
  if (myStream) return;
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    $('localVideo').srcObject = myStream;
  } catch {
    myStream = new MediaStream(); // звонок без камеры/микрофона
  }
}

$('connectBtn').onclick = async () => {
  const id = $('peerInput').value.trim();
  if (!id) return;
  const secret = $('encKey').value.trim();
  if (secret) {
    aesKey = await deriveKey(secret);
    addMsg('🔐 Шифрование переписки включено', 'meta');
  } else {
    aesKey = null;
    addMsg('⚠️ Ключ шифрования пуст — сообщения пойдут открытым текстом', 'meta');
  }
  bindConn(peer.connect(id, { reliable: true }));
};

$('callBtn').onclick = async () => {
  if (!conn) return alert('Сначала подключитесь к собеседнику');
  await getStream();
  activeCall = peer.call(conn.peer, myStream);
  bindCall(activeCall);
};

$('hangBtn').onclick = () => { if (activeCall) activeCall.close(); endCall(); };
function endCall() {
  $('videos').style.display = 'none'; $('controls').style.display = 'none';
  $('chat').style.display = 'block'; $('inputBar').style.display = 'flex';
  $('hangBtn').style.display = 'none'; $('callBtn').disabled = !conn;
  if (myStream) myStream.getTracks().forEach(t => t.stop());
  myStream = null; activeCall = null;
}

$('muteBtn').onclick = () => {
  const t = myStream?.getAudioTracks()[0];
  if (t) t.enabled = !t.enabled;
  $('muteBtn').textContent = t?.enabled ? '🔇 Микрофон' : '🔊 Включить';
};
$('camBtn').onclick = () => {
  const t = myStream?.getVideoTracks()[0];
  if (t) t.enabled = !t.enabled;
  $('camBtn').textContent = t?.enabled ? '📷 Камера' : '🎥 Включить камеру';
};

async function send() {
  const text = $('msgInput').value.trim();
  if (!text || !conn) return;
  const payload = aesKey ? { type: 'msg', encrypted: true, ...(await encryptMsg(text)) }
                         : { type: 'msg', text };
  conn.send(payload);
  addMsg(text, 'out');
  $('msgInput').value = '';
}
$('sendBtn').onclick = send;
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  $('chat').appendChild(div);
  $('chat').scrollTop = 1e6;
}
</script>
</body>
</html>
